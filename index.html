<style>

.ep{display:flex;flex-wrap:wrap;gap:8px}.ep button{width:44px;height:44px;border-radius:50%;background:var(--bg);font-size:22px}.ep button.on{outline:4px solid var(--ink)}

<body>
<div id="app"></div>
<div class="toast stk" id="toast" role="status"></div>
<div class="ov" id="ov" hidden></div><div class="stk" id="inv" hidden></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getDatabase,ref,get,set,update,push,remove,onValue,onChildAdded,onDisconnect,runTransaction,query,orderByChild,limitToLast,limitToFirst,startAt,endAt,increment,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

// ===== НАСТРОЙКИ =====
const CFG={
 databaseURL:'https://neonapp-a05b0-default-rtdb.firebaseio.com', // без apiKey: база открыта правилами (тестовый проект)
 turn:{username:'e95b1fefd993df3f6e65a1a9',credential:'mbUgjTkJSGehspY5'}, // Metered TURN, ключ pk_live_dfce3dad929d89d6a77c9169356a2d71697cc07f
 bot:'' // например 'https://t.me/your_bot/app' — после создания Mini App в BotFather
};
const MIN=2,MAXP=8; // для теста вдвоём; в проде поставьте 3
const COL=['#ffe14a','#ff9a3d','#ff6fb5','#38f0b0','#c9b6ff','#7dd3ff','#b8f27a','#ff7a7a'];
const EMO=['😎','🦊','🐙','🐸','🦄','🐻','🐼','🦁'];
const W=['Аэропорт','Пляж','Больница','Цирк','Космическая станция','Школа','Кинотеатр','Подводная лодка','Зоопарк','Библиотека'];

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const col=u=>COL[[...u].reduce((a,c)=>a+c.charCodeAt(0),0)%COL.length];
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200)};

let db,me,U={name:'',emoji:'😎',coins:0},rid=null,RM=null,ROLE=null,rooms={},top=[],unsubs=[],OFF=0;
let SP=new Set(),local=null,peers={},ICE=[{urls:'stun:stun.relay.metered.ca:80'},{urls:'stun:stun.l.google.com:19302'},...['turn:global.relay.metered.ca:80','turn:global.relay.metered.ca:80?transport=tcp','turn:global.relay.metered.ca:443','turns:global.relay.metered.ca:443?transport=tcp'].map(u=>({urls:u,username:CFG.turn.username,credential:CFG.turn.credential}))],mic=true,AC=null;
let XG=0,GAIN=0,SECRET=null,guard='',doneRound=0,seenRound=0;
const now=()=>Date.now()+OFF;
const L=(q,cb)=>unsubs.push(onValue(q,cb));

// ===== КОМНАТЫ =====
let creating=false;
async function createRoom(g){
 if(creating||entering||rid)return;creating=true;
 try{await createRoom0(g)}catch(e){console.warn(e);toast('Не удалось создать комнату')}finally{creating=false}
}
async function createRoom0(g){
 const id=push(ref(db,'rooms')).key;
 await set(ref(db,'rooms/'+id),{title:((g?'Дурак ':'Комната ')+U.name).slice(0,40),game:g||null,host:me,createdAt:serverTimestamp(),state:{phase:'wait',round:0}});
 await enter(id);
}
let entering=false;
async function enter(id){
 if(entering||rid===id)return;entering=true;animNext=true;
 try{
  if(rid)await leave();
  doneRound=0;doneDk=0;seenRound=0;dkSeenRound=-1;GAIN=0;XG=0;dkSel=null;dkGone='';dkPrev=undefined;
  await enter0(id);
 }catch(e){console.warn(e);toast('Не удалось войти в комнату');try{await leave()}catch(_){}}
 finally{entering=false}
}
async function enter0(id){
 const rm=(await get(ref(db,'rooms/'+id))).val();
 if(!rm)return toast('Комната уже закрыта');
 const cur=rm.players||{};
 if(Object.keys(cur).length>=MAXP&&!cur[me])return toast('Комната полная');
 if(!cur[me]&&(rm.game==='durak'?(rm.dk&&!rm.dk.over):!['wait','result'].includes((rm.state||{}).phase)))return toast('🔒 Игра уже началась, войти нельзя');
 rid=id;if(!roomPushed){history.pushState({room:1},'');roomPushed=true}
 try{local=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});mic=true;watch(local,me)}
 catch(e){local=null;mic=false;toast('Нет доступа к микрофону: вы только слушаете')}
 await remove(ref(db,`signal/${id}/${me}`)).catch(()=>{});
 unsubs.push(onChildAdded(ref(db,`signal/${id}/${me}`),s=>{const m=s.val();remove(s.ref);m&&onSig(m)}));
 const pr=ref(db,`rooms/${id}/players/${me}`);
 await set(pr,{name:U.name,emoji:U.emoji,mic:mic,ready:false,at:serverTimestamp()});
 onDisconnect(pr).remove();update(ref(db,'users/'+me),{room:id});
 L(ref(db,`rooms/${id}`),s=>{const prev=RM;RM=s.val();if(!RM){leave();toast('Комната закрыта');return}if(prev&&prev.host!==me&&RM.host===me)toast('👑 Вы теперь хозяин комнаты');migrate();syncPeers();tick();effects();render()});
 L(ref(db,`roles/${id}/${me}`),s=>{ROLE=s.val();render()});
 const t0=Date.now();
 unsubs.push(onChildAdded(ref(db,`rooms/${id}/gifts`),s=>{const g=s.val();if(!g||Math.abs(now()-g.at)>8000)return;fly(g.to);if(g.to===me){bump(5);toast('🎁 Вам подарок: +5 🪙')}}));
 render();wake();
}
async function leave(){ovClose();animNext=true;if(roomPushed){roomPushed=false;skip++;history.back()}
 unsubs.forEach(f=>f());unsubs=[];Object.keys(peers).forEach(closePeer);Object.values(WI).forEach(clearInterval);try{WL?.release?.()?.catch?.(()=>{})}catch(e){}WL=null;
 local?.getTracks().forEach(t=>t.stop());local=null;SP=new Set();
 const id=rid,r=RM;rid=null;RM=null;ROLE=null;SECRET=null;
 if(id){
  const pr=ref(db,`rooms/${id}/players/${me}`);onDisconnect(pr).cancel();update(ref(db,'users/'+me),{room:null});await remove(pr).catch(()=>{});
  if(r&&!Object.keys(r.players||{}).some(u=>u!==me))await update(ref(db),{['rooms/'+id]:null,['roles/'+id]:null,['signal/'+id]:null}).catch(()=>{});
 }
 render();
}

// ===== ГОЛОС (WebRTC mesh, сигналинг через Firebase) =====
const send=(to,type,data)=>rid&&push(ref(db,`signal/${rid}/${to}`),{from:me,type,data:JSON.stringify(data)}).catch(()=>{});
const WI={};
function getPC(u){
 if(peers[u])return peers[u].pc;
 const pc=new RTCPeerConnection({iceServers:ICE}),p=peers[u]={pc,q:[],at:RM?.players?.[u]?.at};
 local?.getTracks().forEach(t=>pc.addTrack(t,local));
 pc.onicecandidate=e=>e.candidate&&send(u,'ice',e.candidate.toJSON());
 pc.ontrack=e=>{
  const st=e.streams[0]||new MediaStream([e.track]);
  let a=document.getElementById('a_'+u);if(!a){a=document.createElement('audio');a.id='a_'+u;a.autoplay=true;a.setAttribute('playsinline','');document.body.append(a)}
  a.srcObject=st;a.play?.().catch(()=>{});watch(st,u)};
 pc.onconnectionstatechange=()=>{const s=pc.connectionState;clearTimeout(p.t);
  if(s==='failed')redial(u,pc);else if(s==='disconnected')p.t=setTimeout(()=>redial(u,pc),4000)};
 return pc;
}
function redial(u,pc){if(peers[u]?.pc!==pc||pc.connectionState==='connected')return;closePeer(u);setTimeout(()=>{if(rid&&RM)syncPeers()},800)}
function closePeer(u){const p=peers[u];if(!p)return;clearTimeout(p.t);delete peers[u];try{p.pc.close()}catch(e){}document.getElementById('a_'+u)?.remove();SP.delete(u);clearInterval(WI[u]);delete WI[u]}
async function call(u){
 try{
  const pc=getPC(u);if(!local)pc.addTransceiver('audio',{direction:'recvonly'});
  await pc.setLocalDescription(await pc.createOffer());send(u,'offer',pc.localDescription);
 }catch(e){console.warn('call',e);closePeer(u)}
}
async function onSig(m){
 const u=m.from;let d;try{d=JSON.parse(m.data)}catch(e){return}
 try{
  if(m.type==='offer'){
   if(peers[u]?.pc.remoteDescription)closePeer(u); // новый звонок от того же игрока
   const pc=getPC(u);await pc.setRemoteDescription(d);await flush(u);await pc.setLocalDescription(await pc.createAnswer());send(u,'answer',pc.localDescription)}
  else if(m.type==='answer'&&peers[u]){await peers[u].pc.setRemoteDescription(d);await flush(u)}
  else if(m.type==='ice'){let p=peers[u];if(!p){if(me>u)return;getPC(u);p=peers[u]}p.pc.remoteDescription?await p.pc.addIceCandidate(d):p.q.push(d)}
 }catch(e){console.warn('signal',e)}
}
async function flush(u){const p=peers[u];while(p&&p.q.length)await p.pc.addIceCandidate(p.q.shift())}
function syncPeers(){
 if(!RM)return;const ps=RM.players||{};
 for(const u in peers){const a=peers[u].at,b=ps[u]?.at;
  if(!ps[u])closePeer(u);else if(a==null&&b!=null)peers[u].at=b;else if(a!=null&&b!=null&&a!==b)closePeer(u)}
 for(const u in ps)if(u!==me&&!peers[u]&&me>u)call(u); // звонит тот, у кого uid больше
}
function watch(stream,u){ // кольца «говорит» по реальному уровню звука
 try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume?.();
  const an=AC.createAnalyser();an.fftSize=512;AC.createMediaStreamSource(stream).connect(an);
  const b=new Uint8Array(an.fftSize);clearInterval(WI[u]);
  WI[u]=setInterval(()=>{
   if(!rid){clearInterval(WI[u]);return}
   an.getByteTimeDomainData(b);let s=0;for(const v of b)s+=(v-128)**2;
   const on=Math.sqrt(s/b.length)>6&&(u!==me||mic);
   on?SP.add(u):SP.delete(u);
   document.querySelector(`[data-uid="${CSS.escape(u)}"]`)?.classList.toggle('talk',on);
  },150);
 }catch(e){}
}

// ===== ИГРА «ШПИОН» (хозяин комнаты ведёт раунд) =====
async function startGame(){
 const ps=Object.keys(RM.players||{});
 if(ps.length<MIN)return toast(`Нужно минимум ${MIN} игрока`);
 const word=W[Math.random()*W.length|0],spy=ps[Math.random()*ps.length|0];SECRET={spy,word};
 const up={};ps.forEach(u=>{up[`roles/${rid}/${u}`]={spy:u===spy,word:u===spy?'':word};up[`rooms/${rid}/players/${u}/ready`]=false});
 up[`rooms/${rid}/votes`]=null;
 up[`rooms/${rid}/state`]={phase:'reveal',round:(RM.state?.round||0)+1,pl:Object.fromEntries(ps.map(u=>[u,1]))};
 await update(ref(db),up);
}
const setState=o=>set(ref(db,`rooms/${rid}/state`),{round:RM.state.round,...o});
const toTalk=()=>setState({phase:'talk',endsAt:now()+60000});
const toVote=()=>setState({phase:'vote',endsAt:now()+30000});
async function finish(){
 if(!SECRET)return setState({phase:'wait'}),toast('Хозяин перезагрузился: раунд сброшен');
 const c={};Object.values(RM.votes||{}).forEach(v=>c[v]=(c[v]||0)+1);
 const mx=Math.max(0,...Object.values(c)),lead=Object.keys(c).filter(k=>c[k]===mx);
 await setState({phase:'result',spy:SECRET.spy,word:SECRET.word,caught:lead.length===1&&lead[0]===SECRET.spy});
}
async function abort(note){const k='abort'+RM.state.round+RM.state.phase;if(guard===k)return;guard=k;await setState({phase:'wait',note})}
function migrate(){ // хозяин ушёл: самый ранний из оставшихся забирает комнату
 const ps=RM.players||{},ids=Object.keys(ps);if(!ids.length||ps[RM.host])return;
 const next=ids.sort((a,b)=>(ps[a].at||0)-(ps[b].at||0)||(a<b?-1:1))[0];
 if(next===me)update(ref(db,'rooms/'+rid),{host:me});
}
function tick(){
 if(!RM||RM.host!==me)return;
 dkWatch();
 const st=RM.state||{},ps=RM.players||{},ids=Object.keys(ps),k=st.phase+st.round+(st.startAt||'');
 if(st.phase==='wait'){
  if(guard===k)return;
  const all=ids.length>=MIN&&ids.every(u=>ps[u].ready);
  if(all&&!st.startAt){guard=k;setState({phase:'wait',startAt:now()+5000})}
  else if(!all&&st.startAt){guard=k;setState({phase:'wait'})}
  else if(all&&now()>st.startAt){guard=k;startGame()}
  return}
 if(st.phase==='result')return;
 const pl=Object.keys(st.pl||{}).filter(u=>ps[u]);
 if(!SECRET)return abort('Хозяин сменился или перезагрузился: раунд сброшен.');
 if(!ps[SECRET.spy])return abort('Шпион вышел: раунд сброшен.');
 if(pl.length<MIN)return abort('Слишком мало игроков: раунд сброшен.');
 if(guard===k)return;
 if(st.phase==='talk'&&now()>st.endsAt){guard=k;toVote()}
 if(st.phase==='vote'&&(pl.every(u=>RM.votes?.[u])||now()>st.endsAt)){guard=k;finish()}
}
setInterval(()=>{tick();const st=RM?.state,e=$('#tm');const tt=st?.endsAt||st?.startAt;if(e&&tt)e.textContent=Math.max(0,Math.ceil((tt-now())/1000))},500);

// ===== ЭКОНОМИКА =====
const bump=n=>runTransaction(ref(db,'users/'+me+'/coins'),c=>(c||0)+n);
const XP_AT=l=>50*l*(l-1),LVL=xp=>Math.floor((1+Math.sqrt(1+(xp||0)/12.5))/2),TITLES=['Новичок','Болтун','Игрок','Хитрец','Мастер','Легенда'];
const lvInfo=xp=>{const l=LVL(xp),a=XP_AT(l),b=XP_AT(l+1),c=(xp||0)-a;return{l,cur:c,need:b-a,p:Math.min(100,Math.round(c/(b-a)*100))}};
const title=l=>TITLES[Math.min(TITLES.length-1,Math.floor((l-1)/5))],dayN=()=>Math.floor((Date.now()+5*36e5)/864e5);

  let [a,b2,c,d,e,f,g,q]=h;
  for(let i=0;i<64;i++){const t1=(q+(R(e,6)^R(e,11)^R(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((R(a,2)^R(a,13)^R(a,22))+((a&b2)^(a&c)^(b2&c)))|0;q=g;g=f;f=e;e=(d+t1)|0;d=c;c=b2;b2=a;a=(t1+t2)|0}
  [a,b2,c,d,e,f,g,q].forEach((v,i)=>h[i]=(h[i]+v)|0);
 }
 return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}

  case 'rchat':if(rid&&RM)chat({title:'💬 '+RM.title,path:`rooms/${rid}/chat`});break;
  case 'search':openSearch();break;
  case 'addf':e.stopPropagation();addFriend(u);if(b.classList.contains('mini')){b.textContent='Отправлено';b.disabled=true}else toast('Готово');break;
  case 'acc':e.stopPropagation();acceptF(u);toast('Теперь вы друзья 🎉');break;
  case 'dec':e.stopPropagation();declineF(u);break;
  case 'cancelf':cancelF(u);break;
  case 'unf':unfriend(u);break;
  case 'edit':editProf();break;
  case 'saveprof':saveProf();break;
  case 'pe':pickE=b.dataset.e;document.querySelectorAll('.ep button').forEach(x=>x.classList.toggle('on',x===b));break;
  case 'logout':logout();break;
  case 'send':sendMsg();break;
  case 'invf':invPick();break;
  case 'invite':e.stopPropagation();if(!rid)return toast('Сначала зайдите в комнату');push(ref(db,'invites/'+u),{from:me,room:rid,at:serverTimestamp()});toast('Приглашение отправлено 📨');b.textContent='✓';b.disabled=true;break;
  case 'invgo':invBox=null;showInv();case 'joinr':{const id=b.dataset.id;e.stopPropagation();ovClose();if(rid)await leave();enter(id);break}
  case 'invx':invBox=null;showInv();break;
  case 'gift':gift(u);break;
  case 'doauth':doAuth();break;
  case 'authsw':authScreen(b.dataset.m);break;
  case 'guest':authView=null;start(myId(null));break;
  case 'claim':ovClose();authScreen('reg',me);break;
  case 'cancelclaim':location.reload();break;
 }
});

// ===== ЗАГРУЗКА =====
function myId(tu){
 if(tu?.id)return 'tg'+tu.id;
 try{let v=localStorage.getItem('uid');if(!v){v='u'+Math.random().toString(36).slice(2,12)+Date.now().toString(36);localStorage.setItem('uid',v)}return v}
 catch(e){return 'u'+Math.random().toString(36).slice(2,12)}
}
async function boot(){
 try{await boot2()}catch(e){$('#app').innerHTML='<div class="pn stk ph-vote" style="margin-top:40px"><h2>Нет доступа к базе</h2><p>Опубликуйте правила из database.rules.json в Realtime Database → Правила. '+esc(e.code||e.message)+'</p></div>'}
}
async function boot2(){
 $('#app').innerHTML='<h1>Подключаемся…</h1>';
 db=getDatabase(initializeApp({databaseURL:CFG.databaseURL}));
 const tg=window.Telegram?.WebApp;tgInit(tg);
 const tu=tg?.initDataUnsafe?.user;let ss=null,gu=null;
 try{ss=localStorage.getItem('sess');gu=localStorage.getItem('uid')}catch(e){}
 if(tu?.id)return start('tg'+tu.id,tu);
 if(ss)return start(ss);
 if(gu)return start(gu);
 authScreen('reg');
}
async function start(uid,tu){
 const tg=window.Telegram?.WebApp;
 me=uid;authView=null;
 const ur=ref(db,'users/'+me),s=await get(ur);
 if(s.exists())U=s.val();
 else{U={name:(tu?.first_name||'Игрок '+me.slice(-3)).slice(0,24),emoji:EMO[Math.random()*EMO.length|0],coins:100,wins:0,games:0,created:Date.now()};await set(ur,U)}
 UC[me]=U;
 onValue(ur,s=>{if(s.val()){U=s.val();UC[me]=U;if(!rid)render();ovRedraw()}});
 onValue(ref(db,'.info/serverTimeOffset'),s=>OFF=s.val()||0);
 onValue(ref(db,'.info/connected'),s=>{if(!s.val())return;const p=ref(db,'users/'+me);onDisconnect(p).update({online:false,lastSeen:serverTimestamp(),room:null});update(p,{online:true,room:rid||null})});
 onValue(query(ref(db,'rooms'),orderByChild('createdAt'),limitToLast(20)),s=>{rooms=s.val()||{};for(const id in rooms){const r=rooms[id];if(!r.players&&now()-(r.createdAt||0)>15000){update(ref(db),{['rooms/'+id]:null,['roles/'+id]:null,['signal/'+id]:null});delete rooms[id]}}if(!rid)render()});
 let l1=0,l2=0;
 onValue(ref(db,'friends/'+me),s=>{FR=s.val()||{};Object.keys(FR).forEach(watchU);tickUI()});
 onValue(ref(db,'friendReq/'+me),s=>{const o=REQ;REQ=s.val()||{};Object.keys(REQ).forEach(watchU);if(l1&&Object.keys(REQ).some(k=>!o[k]))toast('👋 Новая заявка в друзья');l1=1;tickUI()});
 onValue(ref(db,'friendOut/'+me),s=>{OUT=s.val()||{};tickUI()});
 onValue(ref(db,'userChats/'+me),s=>{const v=s.val()||{},o=CH;
  for(const c in v){watchU(v[c].with);if(l2&&(v[c].unread||0)>(o[c]?.unread||0)&&OV?.cid!==c)toast('💬 '+(usr(v[c].with).name||'')+': '+(v[c].last||'').slice(0,40))}
  l2=1;CH=v;tickUI()});
 onChildAdded(ref(db,'invites/'+me),async s=>{const g=s.val();remove(s.ref);if(!g||now()-(g.at||0)>120000)return;await ensure(g.from);invBox=g;showInv()});
 render();
 const sp=tg?.initDataUnsafe?.start_param||'',h=location.hash;
 if(h)try{history.replaceState(history.state,'',location.pathname+location.search)}catch(e){}
 const id=sp.startsWith('room_')?sp.slice(5):h.startsWith('#r=')?h.slice(3):'';
 if(id){const r=await get(ref(db,'rooms/'+id));r.exists()?enter(id):toast('Комната уже закрыта')}
 const fid=h.startsWith('#f=')?h.slice(3):sp.startsWith('f_')?sp.slice(2):'';
 if(fid&&fid!==me){await ensure(fid);usr(fid).name?openProf(fid):toast('Профиль не найден')}
}

// ===== СОБЫТИЯ =====
function inv(){
 const link=CFG.bot?`${CFG.bot}?startapp=room_${rid}`:`${location.origin}${location.pathname}#r=${rid}`,tg=window.Telegram?.WebApp;
 if(tg?.initData&&CFG.bot)return tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent('Го играть в Шпиона! 🕵️'));
 copyTxt(link,'Ссылка скопирована, шлите друзьям');
}
document.addEventListener('click',e=>{
 AC?.resume();document.querySelectorAll('audio').forEach(x=>x.paused&&x.srcObject&&x.play().catch(()=>{}));const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='join')enter(b.dataset.id);
 else if(a==='create')createRoom();else if(a==='created')createRoom('durak');else if(a==='dkc')dkPlay(b.dataset.c);else if(a==='dkt'){const c=dkSel;dkSel=null;if(c){navigator.vibrate?.(10);dkMove('def',c,+b.dataset.i)}}else if(a==='dktake')dkMove('take');else if(a==='dkbito')dkMove('bito');else if(a==='dkgo')dkStart();
 else if(a==='back')leave();
 else if(a==='start')startGame();
 else if(a==='show'){seenRound=RM.state.round;render()}
 else if(a==='talk')toTalk();
 else if(a==='vote')toVote();
 else if(a==='ready')update(ref(db,`rooms/${rid}/players/${me}`),{ready:!RM.players?.[me]?.ready});
 else if(a==='inv')inv();
 else if(a==='mic'){if(!local)return toast('Разрешите микрофон в настройках и зайдите в комнату заново');mic=!mic;local.getAudioTracks().forEach(t=>t.enabled=mic);update(ref(db,`rooms/${rid}/players/${me}`),{mic});render()}
 else if(a==='seat'){const u=b.dataset.uid,st=RM.state||{};
  if(st.phase==='vote'){if(!st.pl?.[me])return toast('Вы смотрите этот раунд');if(!st.pl?.[u])return toast('Этот игрок не в раунде');if(u===me)return toast('За себя голосовать нельзя');if(RM.votes?.[me])return toast('Вы уже проголосовали');set(ref(db,`rooms/${rid}/votes/${me}`),u)}
  else openProf(u)}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList?.contains('seat')){e.preventDefault();e.target.click()}});
// ===== ПОЛНЫЙ ЭКРАН, TELEGRAM, ЭКРАН НЕ ГАСНЕТ, КАРТЫ-ЗАПАСКА =====
function tgInit(tg){
 if(!tg||!tg.initData)return;
 try{tg.ready();tg.expand();tg.disableVerticalSwipes?.();tg.setHeaderColor?.('#3a4bff');tg.setBackgroundColor?.('#3a4bff');tg.setBottomBarColor?.('#3a4bff');
  if(tg.isVersionAtLeast?.('8.0')&&['android','ios'].includes(tg.platform)&&!tg.isFullscreen)tg.requestFullscreen()}catch(e){}
 const ins=()=>{const a=tg.safeAreaInset||{},c=tg.contentSafeAreaInset||{},r=document.documentElement.style;
  r.setProperty('--sat','0px');r.setProperty('--sab','0px');
  r.setProperty('--tgt',((a.top||0)+(c.top||0))+'px');r.setProperty('--tgb',(a.bottom||0)+'px')};
 ins();['safeAreaChanged','contentSafeAreaChanged','fullscreenChanged'].forEach(ev=>{try{tg.onEvent(ev,ins)}catch(e){}});
}
const FSel=()=>document.fullscreenElement||document.webkitFullscreenElement;
const fsOK=()=>!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen)&&!window.Telegram?.WebApp?.initData&&!standalone();
const fsBtn=()=>fsOK()&&!FSel()?'<button class="cta w stk" style="width:100%;margin-top:10px" data-act="fs">⛶ На весь экран</button>':'';
async function goFS(){try{const e=document.documentElement;await(e.requestFullscreen?e.requestFullscreen({navigationUI:'hide'}):e.webkitRequestFullscreen())}catch(e){}}
let autoFs=false;
addEventListener('pointerup',()=>{if(autoFs||!fsOK()||FSel()||!matchMedia('(pointer:coarse)').matches)return;autoFs=true;goFS()});
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{lastHTML='';render()}));
const vv=window.visualViewport,fit=()=>{
 document.documentElement.style.setProperty('--vvh',Math.round(vv?vv.height:innerHeight)+'px');
 if(vv&&vv.offsetTop)scrollTo(0,0);const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight};
vv?.addEventListener('resize',fit);vv?.addEventListener('scroll',fit);addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,300));fit();
let WL=null;
async function wake(){try{if(rid&&!WL&&navigator.wakeLock&&document.visibilityState==='visible'){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}}catch(e){WL=null}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wake();AC?.resume?.();document.querySelectorAll('audio').forEach(a=>a.srcObject&&a.play?.().catch(()=>{}))}});
const badImg=new Set();
const txtCard=(c,x)=>{const t=cs(c),r=c.slice(0,-1),red='♥♦'.includes(t);return `<div class="card ${red?'r':''} ${x||''}"><div class="ix a">${esc(r)}<small>${sv(t)}</small></div><div class="big">${sv(t)}</div><div class="ix b">${esc(r)}<small>${sv(t)}</small></div></div>`};
addEventListener('error',e=>{const i=e.target;if(i?.tagName!=='IMG'||!i.closest?.('.card.im'))return;badImg.add(i.alt);lastHTML='';render()},true);
addEventListener('unhandledrejection',e=>console.warn('promise',e.reason));
boot();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});
</script>
